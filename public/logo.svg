<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090514" />
    </radialGradient>
    
    <!-- Accent Gradient 1 - Neon Violet/Indigo -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Accent Gradient 2 - Cyber Cyan/Blue -->
    <linearGradient id="secondaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    
    <!-- Glassmorphic Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Cosmic Background -->
  <rect width="800" height="800" rx="160" fill="url(#bgGrad)" />

  <!-- Ambient Glow Behind Logo -->
  <circle cx="400" cy="400" r="180" fill="url(#primaryGrad)" opacity="0.3" filter="url(#glow)" />

  <!-- Outer Ring (Broken/Techy) -->
  <circle cx="400" cy="400" r="280" stroke="url(#secondaryGrad)" stroke-width="8" stroke-dasharray="40 180 300 100 80 50" stroke-linecap="round" fill="none" opacity="0.6" />
  <circle cx="400" cy="400" r="250" stroke="url(#primaryGrad)" stroke-width="4" stroke-dasharray="100 300" stroke-linecap="round" fill="none" opacity="0.4" />

  <!-- Central Symbol: Code Brackets & Universal Compile Arrows -->
  <g transform="translate(100, 100)">
    <!-- Left Bracket < -->
    <path d="M 230 250 L 120 300 L 230 350" stroke="url(#primaryGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Right Bracket > -->
    <path d="M 370 250 L 480 300 L 370 350" stroke="url(#primaryGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Vertical compiler slash -->
    <path d="M 340 180 L 260 420" stroke="url(#secondaryGrad)" stroke-width="24" stroke-linecap="round" fill="none" />
    
    <!-- Top-Right and Bottom-Left Accent Nodes -->
    <circle cx="340" cy="180" r="16" fill="#06b6d4" filter="url(#glow)" />
    <circle cx="260" cy="420" r="16" fill="#8b5cf6" filter="url(#glow)" />
    
    <!-- Play/Execute triangle in center representing "Compilation Output / Play" -->
    <polygon points="310,275 310,325 350,300" fill="url(#secondaryGrad)" />
  </g>
</svg>
